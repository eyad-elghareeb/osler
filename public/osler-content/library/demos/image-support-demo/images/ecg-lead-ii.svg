<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-label="Example ECG lead II tracing with ST elevation">
  <rect width="400" height="120" fill="#fff" />
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="30" x2="400" y2="30" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="90" x2="400" y2="90" />
  </g>
  <polyline fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
    points="0,60 30,60 40,62 50,40 58,78 66,60 110,60 120,62 130,40 138,78 146,60 190,60 200,62 210,40 218,80 226,60 400,60" />
  <text x="8" y="16" font-family="monospace" font-size="11" fill="#64748b">Lead II — ST elevation</text>
</svg>
