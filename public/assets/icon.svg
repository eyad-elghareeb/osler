<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Medical cross / pulse hybrid -->
  <g transform="translate(256, 256)">
    <!-- Pulse line -->
    <path d="M -160 0 L -90 0 L -50 -80 L -10 80 L 30 -40 L 70 0 L 160 0"
          stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Medical cross (subtle, behind pulse) -->
    <g opacity="0.18" fill="#60a5fa">
      <rect x="-30" y="-110" width="60" height="220" rx="14"/>
      <rect x="-110" y="-30" width="220" height="60" rx="14"/>
    </g>
  </g>
  <!-- "M" lettermark in bottom-right -->
  <text x="384" y="424" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="80" font-weight="700" fill="#60a5fa" text-anchor="middle" opacity="0.85">M</text>
</svg>
