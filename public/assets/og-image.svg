<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Logo Mark -->
  <g transform="translate(140, 140)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <!-- Pulse symbol -->
    <path d="M 18 50 L 32 50 L 40 28 L 50 72 L 60 38 L 70 50 L 82 50"
          stroke="url(#og-accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  </g>

  <!-- Brand Typography -->
  <text x="270" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Osler</text>
  <text x="270" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Medical Study Platform</text>

  <!-- Hero Value Proposition -->
  <text x="140" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#f8fafc" letter-spacing="-0.01em">
    Master Clinical Medicine with Precision
  </text>
  <text x="140" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    High-yield question bank, active recall flashcards, OSCE simulation, and clinical reference library.
  </text>

  <!-- Engine Badges -->
  <g transform="translate(140, 470)">
    <!-- Quiz -->
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="65" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#93c5fd" text-anchor="middle">Quiz &amp; Bank</text>

    <!-- Flashcards -->
    <rect x="145" y="0" width="130" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="210" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#86efac" text-anchor="middle">Flashcards</text>

    <!-- OSCE -->
    <rect x="290" y="0" width="110" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="345" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fca5a5" text-anchor="middle">OSCE</text>

    <!-- Library -->
    <rect x="415" y="0" width="110" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="470" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#c084fc" text-anchor="middle">Library</text>

    <!-- Offline Ready -->
    <rect x="540" y="0" width="150" height="42" rx="21" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="615" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#60a5fa" text-anchor="middle">⚡ Offline PWA</text>
  </g>
</svg>
