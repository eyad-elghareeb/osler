name = "osler-cloud"
main = "src/index.ts"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "osler-cloud"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# ── BEGIN optional D1 shards (managed by `npm run db:shard`) ──
# progress_documents is partitioned USER-BY-USER across a pool of numbered
# sync databases — every kind of a user's sync data lives in exactly one
# shard, recorded on the user row (users.sync_shard, core DB). Six shards ×
# 500 MB free-tier ceiling ≈ 2.5 GB of usable sync storage; telemetry keeps
# its own database. Read/write row quotas (5M reads / 100K writes per day)
# are ACCOUNT-WIDE — sharding multiplies only storage. Uncomment all seven
# blocks and run `npm run db:shard`: it creates the databases, fills the IDs
# in, applies their migrations, backfills users.sync_shard, moves each
# user's rows from a legacy single sync database (if one exists) into their
# shard, and verifies. Deploying WITHOUT these bindings keeps everything in
# the DB above (the worker falls back to it), so sharding is strictly opt-in.
#
# [[d1_databases]]
# binding = "DB_SYNC_1"
# database_name = "osler-sync-1"
# database_id = "REPLACE_WITH_SYNC_1_D1_ID"
# migrations_dir = "migrations-sync"
#
# [[d1_databases]]
# binding = "DB_SYNC_2"
# database_name = "osler-sync-2"
# database_id = "REPLACE_WITH_SYNC_2_D1_ID"
# migrations_dir = "migrations-sync"
#
# [[d1_databases]]
# binding = "DB_SYNC_3"
# database_name = "osler-sync-3"
# database_id = "REPLACE_WITH_SYNC_3_D1_ID"
# migrations_dir = "migrations-sync"
#
# [[d1_databases]]
# binding = "DB_SYNC_4"
# database_name = "osler-sync-4"
# database_id = "REPLACE_WITH_SYNC_4_D1_ID"
# migrations_dir = "migrations-sync"
#
# [[d1_databases]]
# binding = "DB_SYNC_5"
# database_name = "osler-sync-5"
# database_id = "REPLACE_WITH_SYNC_5_D1_ID"
# migrations_dir = "migrations-sync"
#
# [[d1_databases]]
# binding = "DB_SYNC_6"
# database_name = "osler-sync-6"
# database_id = "REPLACE_WITH_SYNC_6_D1_ID"
# migrations_dir = "migrations-sync"
#
# [[d1_databases]]
# binding = "DB_TELEMETRY"
# database_name = "osler-telemetry"
# database_id = "REPLACE_WITH_TELEMETRY_D1_ID"
# migrations_dir = "migrations-telemetry"
# ── END optional D1 shards ──

# Optional: R2 bucket for web-admin content storage.
# Create with: wrangler r2 bucket create osler-content
# Remove or comment out this block if you don't use web-admin content management.
[[r2_buckets]]
binding = "CONTENT"
bucket_name = "osler-content"

# Durable Object that holds per-user WebSocket connections for realtime sync
# pokes ("your other device just pushed — pull now"). SQLite-backed classes
# are free-tier eligible; the hub hibernates between pokes, so idle sockets
# cost neither duration nor requests.
[durable_objects]
bindings = [{ name = "USER_SYNC_HUB", class_name = "UserSyncHub" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSyncHub"]

# Cron triggers — runs the cleanup job (expired sessions, OAuth states,
# password-reset tokens, audit-log entries older than 1 year). The free tier
# allows up to 5 cron triggers.
[triggers]
crons = ["0 * * * *"]

[vars]
# Set this to the Pages/custom-domain origin hosting the Osler app.
# Multiple origins are not supported; set this to the exact origin
# (scheme + host + port) the browser uses to load your app.
ALLOWED_ORIGIN = "http://localhost:3000"
# Set to true after configuring TURNSTILE_SECRET_KEY and publishing its site key.
# PRODUCTION INSTANCES SHOULD ENABLE THIS: with the flag off, login brute-force
# protection relies only on rate limits + the D1 lockout. Turnstile adds a
# free human-verification gate on register/login/reset that distributed
# attackers cannot parallelize.
TURNSTILE_ENABLED = "false"
# The Worker callback base URL. Replace after first deployment.
WORKER_URL = "http://localhost:8787"

# ── Optional: live Cloudflare quota data (admin analytics panel) ──
# Without these, GET /v1/admin/analytics/cloudflare-limits serves D1-derived
# estimates and the panel shows "Estimated" + connect steps. To go live:
#   1. Paste your 32-hex-char Cloudflare account ID below.
#   2. Set the token as a SECRET (never commit it here):
#        npx wrangler secret put CF_ANALYTICS_TOKEN
#      The token needs one permission: Account → Account Analytics → Read.
#      Optionally add Account → D1 → Read so the panel's D1 storage gauge
#      shows real database file sizes instead of per-table estimates.
#   3. Redeploy the Worker. Full guide: docs/cloudflare-analytics.md
# CF_ACCOUNT_ID = "00000000000000000000000000000000"
# CF_R2_BUCKET = "osler-content"
