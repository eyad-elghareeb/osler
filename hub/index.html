<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Osler — Medical Study Platform">
  <title>Osler</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../dist/index-engine.css">
  <link rel="stylesheet" href="../dist/shared.css">
  <style>
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; }
    .topbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; height: 48px; padding: 0 1rem; background: var(--surface); border-bottom: 1px solid var(--border); }
    .topbar-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
    #quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .auth-dropdown { position: relative; }
    .auth-btn { display: flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.7rem; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.8rem; cursor: pointer; transition: border-color var(--transition); }
    .auth-btn:hover { border-color: var(--accent); }
    .auth-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-dim); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: var(--accent); }
    .auth-menu { display: none; position: absolute; top: 100%; right: 0; margin-top: 4px; min-width: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); z-index: 200; overflow: hidden; }
    .auth-menu.open { display: block; }
    .auth-menu-item { display: flex; align-items: center; gap: 0.5rem; width: 100%; padding: 0.6rem 0.85rem; border: none; background: none; color: var(--text); font-size: 0.82rem; cursor: pointer; text-align: left; transition: background var(--transition-fast); }
    .auth-menu-item:hover { background: var(--surface2); }
    .auth-menu-item .icon { width: 18px; height: 18px; }
    .auth-provider-btn { display: flex; align-items: center; gap: 0.5rem; width: 100%; padding: 0.7rem 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.85rem; cursor: pointer; transition: border-color var(--transition); }
    .auth-provider-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="topbar-title">Osler</span>
    <div class="topbar-actions">
      <div class="auth-dropdown" id="auth-dropdown"></div>
    </div>
  </div>
  <div id="quiz-grid"></div>

  <script>
    window.ENGINE_BASE = '../dist/';
    window.QUIZZES = [];
  </script>
  <script src="../dist/engine-shared.js"></script>
  <script src="../dist/index-engine.js"></script>
  <script type="module">
    import { subscribe, signInAsGuest, signInWithGoogle, signInWithGitHub, signOut, initAuth } from '../src/lib/auth.js';

    function renderAuth(user) {
      const container = document.getElementById('auth-dropdown');
      if (!user) {
        container.innerHTML = `
          <div class="auth-menu" id="auth-menu">
            <button class="auth-menu-item" onclick="signInWithGoogle()">
              <svg class="icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              Sign in with Google
            </button>
            <button class="auth-menu-item" onclick="signInWithGitHub()" style="margin-top:0.25rem">
              <svg class="icon" viewBox="0 0 24 24" fill="#fff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
              Sign in with GitHub
            </button>
          </div>
        `;
        return;
      }

      const isGuest = user.isGuest;
      const avatar = isGuest ? 'G' : (user.displayName?.[0] || user.email?.[0] || 'U');
      const displayName = isGuest ? 'Guest' : (user.displayName || user.email || 'User');

      container.innerHTML = `
        <button class="auth-btn" onclick="toggleAuthMenu()">
          <span class="auth-avatar">${avatar}</span>
          <span>${displayName}</span>
        </button>
        <div class="auth-menu" id="auth-menu">
          <div style="padding:0.6rem 0.85rem;border-bottom:1px solid var(--border);font-size:0.78rem;color:var(--text-muted)">
            ${isGuest ? 'Signed in as Guest' : displayName}
          </div>
          <button class="auth-menu-item" onclick="handleSignOut()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </button>
        </div>
      `;
    }

    window.signInWithGoogle = async () => { try { await signInWithGoogle(); } catch (e) { console.error(e); } };
    window.signInWithGitHub = async () => { try { await signInWithGitHub(); } catch (e) { console.error(e); } };
    window.handleSignOut = async () => { try { await signOut(); } catch (e) { console.error(e); } };
    window.toggleAuthMenu = () => document.getElementById('auth-menu')?.classList.toggle('open');

    document.addEventListener('click', (e) => {
      const dd = document.getElementById('auth-dropdown');
      if (dd && !dd.contains(e.target)) {
        document.getElementById('auth-menu')?.classList.remove('open');
      }
    });

    subscribe(renderAuth);
    initAuth();
  </script>
</body>
</html>
