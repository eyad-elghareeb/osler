name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: Deploy backend Worker (D1 + R2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Worker dependencies
        run: npm ci

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate

      - name: Set Worker secrets (skipped when not configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_JWT_SECRET: ${{ secrets.CF_JWT_SECRET }}
        run: |
          if [ -n "$CF_JWT_SECRET" ]; then echo "$CF_JWT_SECRET" | npx wrangler secret put JWT_SECRET; fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ALLOWED_ORIGIN: ${{ secrets.CF_ALLOWED_ORIGIN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        run: |
          ARGS=""
          if [ -n "$CF_ALLOWED_ORIGIN" ]; then ARGS="$ARGS --var ALLOWED_ORIGIN:$CF_ALLOWED_ORIGIN"; fi
          if [ -n "$CF_WORKER_URL" ]; then ARGS="$ARGS --var WORKER_URL:$CF_WORKER_URL"; fi
          npx wrangler deploy $ARGS

  deploy-frontend:
    name: Build & deploy static export to Cloudflare Pages
    needs: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate content manifests
        run: npm run generate-manifests

      - name: Build static export
        env:
          NEXT_PUBLIC_CLOUD_API_URL: ${{ secrets.CF_WORKER_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:pages
