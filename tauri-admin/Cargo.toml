[package]
name = "osler-admin"
version = "5.1.0"
description = "Osler Admin Dashboard — Native Tauri v2 desktop app (no Python required)"
authors = ["Osler"]
edition = "2021"

[lib]
name = "osler_admin_lib"
path = "src/lib.rs"

[[bin]]
name = "osler-admin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# HTTP client: ureq is used by the existing v5 code (commands.rs/deploy.rs);
# reqwest is added per Phase 5.0.1 spec for the new auth.rs / mcp_server.rs
# modules that need async HTTP.
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Async runtime for reqwest + future MCP server.
tokio = { version = "1", features = ["full"] }
# Git operations: git2 crate per Phase 5.0.1 spec. The existing git.rs uses
# std::process::Command shell-out (which we keep for backward compat); new
# Phase 5 code should prefer git2 for in-process safety.
git2 = { version = "0.19", default-features = false }
jsonschema = "0.18"
base64 = "0.22"
zip = "2"
portpicker = "0.1.1"
open = { version = "5.3.5", features = ["shellexecute-on-windows"] }
tiny_http = "0.12"
notify = { version = "7", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
