# =============================================================================
# Osler V2 — Developer & Site Admin Documentation
# mkdocs-material configuration
# =============================================================================
# How to serve locally:
#   pip install mkdocs mkdocs-material mkdocs-section-index
#   cd osler-v2-developer-admin-docs
#   mkdocs serve
# Open http://127.0.0.1:8000
#
# How to build a static site for deployment:
#   mkdocs build                # produces site/
#   # deploy site/ to GitHub Pages / Netlify / Firebase Hosting
# =============================================================================

site_name: Osler V2 — Developer & Site Admin Docs
site_description: >-
  Technical documentation for developers and site administrators of the Osler V2
  modular quiz-site platform — generator, generated PWAs, optional Firebase backend.
site_url: https://osler.app/docs/
repo_name: osler-app/osler
repo_url: https://github.com/osler-app/osler
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/school

plugins:
  - search
  - section-index

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/osler-app/osler
  version:
    provider: mike

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Data Flow: architecture/data-flow.md
      - Security Model: architecture/security-model.md
  - Development:
      - Getting Started: development/getting-started.md
      - Project Structure: development/project-structure.md
      - Coding Conventions: development/coding-conventions.md
      - Testing: development/testing.md
      - Contributing: development/contributing.md
  - Admin Dashboard:
      - Overview: admin-dashboard/overview.md
      - Installation: admin-dashboard/installation.md
      - Content CMS: admin-dashboard/content-cms.md
      - AI Content Generation: admin-dashboard/content-generation.md
      - Bundle Updates: admin-dashboard/bundle-update.md
      - Settings: admin-dashboard/settings.md
  - Site Generation:
      - Wizard: site-generation/wizard.md
      - Content Packs: site-generation/content-packs.md
      - Local Preview: site-generation/preview.md
  - Deployment:
      - GitHub Pages: deployment/github-pages.md
      - Netlify: deployment/netlify.md
      - Vercel: deployment/vercel.md
      - Cloudflare Pages: deployment/cloudflare-pages.md
      - Rollback: deployment/rollback.md
  - Firebase:
      - Bring Your Own: firebase/bring-your-own.md
      - Firestore Rules: firebase/firestore-rules.md
      - Storage Rules: firebase/storage-rules.md
      - Sync Strategies: firebase/sync-strategies.md
  - Engines:
      - Quiz: engines/quiz.md
      - Bank: engines/bank.md
      - Flashcard: engines/flashcard.md
      - Written: engines/written.md
      - OSCE: engines/osce.md
  - Content Authoring:
      - Schemas: content-authoring/schemas.md
      - Content Types: content-authoring/content-types.md
      - Meta Fields: content-authoring/meta-fields.md
      - Validation: content-authoring/validation.md
  - Internationalization:
      - Overview: i18n/overview.md
      - Adding Strings: i18n/adding-strings.md
      - RTL Guide: i18n/rtl-guide.md
  - AI Tutor:
      - Overview: ai-tutor/overview.md
      - Cost Caps: ai-tutor/cost-caps.md
  - Operations:
      - CI/CD: operations/ci-cd.md
      - Monitoring: operations/monitoring.md
      - Backups: operations/backups.md
      - Incident Response: operations/incident-response.md
  - Troubleshooting:
